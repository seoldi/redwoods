<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redwoods — Demo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      background: #0d1117;
      font-family: -apple-system, 'Segoe UI', sans-serif;
    }

    /* ── 상단 탭바 */
    .topbar {
      display: flex;
      align-items: center;
      background: #161b22;
      border-bottom: 1px solid #30363d;
      padding: 0 20px;
      height: 48px;
      flex-shrink: 0;
      gap: 0;
    }

    .logo {
      font-size: 13px;
      font-weight: 700;
      color: #e6edf3;
      margin-right: 20px;
      white-space: nowrap;
      letter-spacing: .02em;
    }

    .nav {
      display: flex;
      flex: 1;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .nav::-webkit-scrollbar { display: none; }

    .nav button {
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      color: #8b949e;
      font-size: 12.5px;
      padding: 0 13px;
      height: 48px;
      cursor: pointer;
      white-space: nowrap;
      transition: color .15s, border-color .15s;
      flex-shrink: 0;
    }
    .nav button:hover  { color: #c9d1d9; }
    .nav button.active { color: #58a6ff; border-bottom-color: #58a6ff; }

    .gh-link {
      color: #8b949e;
      font-size: 12px;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 5px;
      margin-left: 16px;
      white-space: nowrap;
      flex-shrink: 0;
      transition: color .15s;
    }
    .gh-link:hover { color: #e6edf3; }

    /* ── 주소창 바 */
    .urlbar {
      display: flex;
      align-items: center;
      background: #0d1117;
      border-bottom: 1px solid #21262d;
      padding: 6px 20px;
      gap: 8px;
      flex-shrink: 0;
    }

    .url-dots { display: flex; gap: 5px; }
    .url-dot {
      width: 10px; height: 10px; border-radius: 50%;
    }
    .url-dot.r { background: #ff5f56; }
    .url-dot.y { background: #ffbd2e; }
    .url-dot.g { background: #27c93f; }

    .url-field {
      flex: 1;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #8b949e;
      font-size: 12px;
      padding: 4px 12px;
      text-align: center;
      max-width: 480px;
      margin: 0 auto;
    }

    .live-link {
      color: #58a6ff;
      font-size: 11.5px;
      text-decoration: none;
      white-space: nowrap;
      margin-left: auto;
    }
    .live-link:hover { text-decoration: underline; }

    /* ── iframe */
    iframe {
      flex: 1;
      border: none;
      width: 100%;
      background: #fff;
    }
  </style>
</head>
<body>

  <div class="topbar">
    <span class="logo">🏢 Redwoods</span>
    <nav class="nav" id="nav">
      <button data-src="static/index.html" data-label="메인" class="active">메인</button>
      <button data-src="static/brand.html" data-label="브랜드">브랜드</button>
      <button data-src="static/overview.html" data-label="단지개요">단지개요</button>
      <button data-src="static/placement.html" data-label="배치도">배치도</button>
      <button data-src="static/plane.html" data-label="평면도">평면도</button>
      <button data-src="static/complex.html" data-label="커뮤니티">커뮤니티</button>
      <button data-src="static/premium.html" data-label="프리미엄">프리미엄</button>
      <button data-src="static/constructor.html" data-label="시공사">시공사</button>
      <button data-src="static/emodel.html" data-label="e-모델하우스">e-모델하우스</button>
      <button data-src="static/layout.html" data-label="동호수배치">동호수배치</button>
    </nav>
    <a class="gh-link" href="https://github.com/seoldi/redwoods" target="_blank" rel="noopener">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor">
        <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38
        0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13
        -.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66
        .07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15
        -.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0
        1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82
        1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01
        1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
      </svg>
      seoldi/redwoods
    </a>
  </div>

  <div class="urlbar">
    <div class="url-dots">
      <div class="url-dot r"></div>
      <div class="url-dot y"></div>
      <div class="url-dot g"></div>
    </div>
    <div class="url-field" id="urlField">static/index.html</div>
    <a class="live-link" href="https://xn--9m1b22au1d9pl83bx1fvpfhtqo1bg6g.kr/" target="_blank" rel="noopener">운영 사이트 →</a>
  </div>

  <iframe src="static/index.html" id="frame"></iframe>

  <script>
    var frame   = document.getElementById('frame');
    var urlField = document.getElementById('urlField');
    var buttons = document.querySelectorAll('.nav button');

    buttons.forEach(function(btn) {
      btn.addEventListener('click', function() {
        buttons.forEach(function(b) { b.classList.remove('active'); });
        btn.classList.add('active');
        var src = btn.dataset.src;
        frame.src = src;
        urlField.textContent = btn.dataset.label;
      });
    });
  </script>

</body>
</html>
